# Compile les versions Linux (AppImage et .deb) et les ajoute à la release GitHub.
# Se déclenche à la publication d'une release ; peut aussi être lancé à la main pour une release existante.
name: Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release à compléter (par exemple v0.4.1)
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilation Linux
        run: npm run dist:linux

      - name: Ajout à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber
