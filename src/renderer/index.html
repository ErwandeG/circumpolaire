<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://data.geopf.fr; connect-src 'self' https://data.geopf.fr"
    />
    <title>Circumpolaire</title>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1 class="app-title">Circumpolaire</h1>

        <form class="search" id="search-form" autocomplete="off">
          <label class="search-label" for="search-input">Adresse ou ville</label>
          <div class="search-row">
            <input
              id="search-input"
              class="search-input"
              type="search"
              placeholder="Ex. 1 place Kléber, Strasbourg"
              spellcheck="false"
            />
            <button id="search-button" class="search-button" type="submit">Chercher</button>
          </div>
        </form>

        <p id="search-message" class="message" role="status" hidden></p>
        <ul id="search-results" class="results" hidden></ul>

        <section class="current" aria-labelledby="current-title">
          <h2 id="current-title" class="section-title">Lieu de calcul</h2>
          <p id="current-label" class="current-label"></p>
          <p id="current-meta" class="current-meta"></p>
        </section>

        <section class="calendar" aria-labelledby="calendar-title">
          <h2 id="calendar-title" class="section-title">Calendrier lunaire</h2>
          <div class="cal-header">
            <button id="cal-prev" class="cal-nav" type="button" aria-label="Mois précédent">‹</button>
            <span id="cal-month" class="cal-month"></span>
            <button id="cal-next" class="cal-nav" type="button" aria-label="Mois suivant">›</button>
            <button id="cal-today" class="cal-today" type="button">Aujourd’hui</button>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
          <ul class="legend">
            <li><span class="swatch tranche-green"></span>0–25 %</li>
            <li><span class="swatch tranche-yellow"></span>25–50 %</li>
            <li><span class="swatch tranche-orange"></span>50–75 %</li>
            <li><span class="swatch tranche-red"></span>75–100 %</li>
            <li class="legend-wide">
              <span class="presence legend-bar"><span class="presence-moon" style="left: 55%; width: 45%"></span></span>
              Nuit : sombre = Lune couchée, clair = Lune levée
            </li>
            <li class="legend-wide"><span class="day-badge legend-badge">N</span>Nuit nautique (nuit astronomique absente ou &lt; 1 h)</li>
          </ul>
        </section>

        <section id="night-detail" class="detail" aria-live="polite"></section>
      </aside>

      <main id="map" class="map" aria-label="Carte"></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
